[project]
name = "ai-bug-investigator"
version = "0.1.0"
description = ""
authors = [
    {name = "VoidAEZAKMI",email = "adilet.t.k@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard] (>=0.163.1,<0.164.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]

[tool.poetry]
packages = [{include = "ai_bug_investigator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]
